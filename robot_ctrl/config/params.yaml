%YAML:1.0

# 系统参数
TS:200

# 里程计值缩放系数
odom_coeff:
    front: [1.0375, 1.0375, 1.0375]
    back: [1.0375, 1.0375, 1.0375]
    # back: [1.048881, 1.063183, 0.994876]
    # front: [1.040268, 1.05457, 1.016019]

# 舵轮电机速度范围 (m/s)
steer_vel_range: [-0.2, 0.2]

# IMU俯仰角PID控制参数
use_imu_pitch: [1]
imu_pitch:
    P: [0.01, 0.01]          # 前后侧比例增益
    I: [0.001, 0.001]        # 前后侧积分增益
    D: [0.0001, 0.0001]        # 前后侧微分增益
    Iband: [5.0, 5.0]          # 前后侧积分死区(度)
    acc_I_range: [-0.1, 0.1]   # 积分限幅范围
    out_range: [-0.05, 0.05]     # 输出限幅范围

# IMU偏航角PID控制参数
use_imu_yaw: [1]
imu_yaw:
    P: [0.01, 0.01]          # 前后侧比例增益
    I: [0.001, 0.001]        # 前后侧积分增益
    D: [0.0001, 0.0001]        # 前后侧微分增益
    Iband: [5.0, 5.0]        # 前后侧积分死区(度)
    acc_I_range: [-0.1, 0.1]   # 积分限幅范围
    out_range: [-0.05, 0.05]     # 输出限幅范围

# 弯折角控制参数
body_angle:
    range: [-20.1, 90.2]       # 弯折角度范围(度)

# # 直径到机械角度的转换系数
